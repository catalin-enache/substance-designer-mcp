# Type checking for every Python file in the repository. Run it through its test, which finds
# Designer's own `sd` package and PySide6 stubs (MYPYPATH) in the Designer install:
#   mcp_server/venv/bin/python -m pytest tests/unit/test_types.py
# A plain `python -m mypy` lacks them: the Designer-side code then reports ignores and Any returns.
[mypy]
python_version = 3.10
files = .
# .claude/skills/mcp-builder: Anthropic's skill, vendored
exclude = (^|/)(mcp_server/venv|\.mypy_cache|\.claude/skills/mcp-builder)/
mypy_path = $MYPY_CONFIG_FILE_DIR, $MYPY_CONFIG_FILE_DIR/mcp_server, $MYPY_CONFIG_FILE_DIR/tests, $MYPY_CONFIG_FILE_DIR/tests/unit, $MYPY_CONFIG_FILE_DIR/client
explicit_package_bases = True
strict = True
warn_unreachable = True

# Adobe's and Qt's code: used for the types of what we call, never checked itself
[mypy-sd.*,PySide6.*,shiboken6.*]
follow_imports = silent
ignore_errors = True
ignore_missing_imports = True
