# Type checking for every Python file in the repository. Run it through its test, which finds
# Designer's own `sd` package and PySide6 stubs (MYPYPATH) in the Designer install:
#   mcp_server/venv/bin/python -m pytest tests/unit/test_types.py
# A plain `python -m mypy` lacks them: the Designer-side code then reports ignores and Any returns.
[mypy]
# Every Python file's minimum (project_constants.MIN_PYTHON; DECISIONS.md, Project rules)
python_version = 3.12
# The search of . skips the folders whose name starts with a dot: .claude/hooks is named. Not all of .claude: Claude
# Code makes its worktrees in .claude/worktrees/, copies of every module, which stop mypy (tests/unit/test_types.py)
files = ., .claude/hooks
# .claude/skills/mcp-builder: Anthropic's skill, vendored
exclude = (^|/)(mcp_server/venv|\.mypy_cache|\.claude/skills/mcp-builder)/
mypy_path = $MYPY_CONFIG_FILE_DIR, $MYPY_CONFIG_FILE_DIR/mcp_server, $MYPY_CONFIG_FILE_DIR/tests, $MYPY_CONFIG_FILE_DIR/tests/unit, $MYPY_CONFIG_FILE_DIR/client
explicit_package_bases = True
strict = True
warn_unreachable = True
# mypy reports an Any written in an annotation, a signature, a cast or a type alias, the ... of Callable[..., T]
# included. One that stays takes the mark .claude/rules/python.md gives. An Any inside an expression, such as
# defaultdict[str, Any](int), or one that comes in implicitly, such as json.loads's result, isn't reported
# (tests/unit/test_types.py)
disallow_any_explicit = True
# The sd functions that Designer scripts call to reach the application and its Qt UI manager. Adobe left them without
# annotations, so strict mypy would refuse each call to them. Their results still come back as an implicit Any
untyped_calls_exclude = sd.getContext, sd.context.Context.getSDApplication, sd.api.sdapplication.SDApplication.getQtForPythonUIMgr

# Adobe's and Qt's code: used for the types of what we call, never checked itself
[mypy-sd.*,PySide6.*,shiboken6.*]
follow_imports = silent
ignore_errors = True
ignore_missing_imports = True
